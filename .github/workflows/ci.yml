name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          runtime: node@26
          require-lockfile: true

      - name: Lint code
        run: pnpm run lint

      - name: Build project
        run: pnpm run build
        env:
          CI: true
